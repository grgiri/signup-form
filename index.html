<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar-img">
        <div class="logo-container">
            <img src="odin-lined.png" alt="logo image">
            <span class="logo-text">Odin</span>
        </div>
    </div>

    <div class="main-content">
        <div class="intro-text">
            <p>
                This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up <em>now</em> to get started.
            </p>
            <p>
                You <em>know</em> you want to.
            </p>
        </div>

        <div class="form-section">
            <h3>Let's do this!</h3>
            <form action="#" method="post">
                <div class="form-grid">
                    <div class="form-item">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    <div class="form-item">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                    <div class="form-item">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-item">
                        <label for="phone-number">Phone Number</label>
                        <input type="number" id="phone-number" name="phone-number">
                    </div>
                    <div class="form-item">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required minlength="8" placeholder=" ">
                    </div>
                    <div class="form-item">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required minlength="8" placeholder=" ">
                    </div>
                </div>                
                
            </form>           
            
        </div>

        <button type="submit" class="btn-create">Create Account</button>

        <p class="login-link">Already have an account? <a href="#">Log in</a></p>
    </div>
    
</body>
</html>
